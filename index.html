<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Card Battler - 60/20/20 Update</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 15px;
      user-select: none;
    }
    h1 { margin: 5px 0 15px 0; color: #f1c40f; }
    
    #connection-panel {
      background: #2c3e50;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      width: 320px;
    }
    .pin-display {
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #f1c40f;
      background: #1a1a24;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .copy-btn {
      font-size: 0.9rem;
      padding: 6px 10px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    input {
      padding: 12px;
      font-size: 1.2rem;
      border-radius: 6px;
      border: none;
      text-align: center;
      width: 80%;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    button.action-btn {
      padding: 12px 20px;
      font-size: 1rem;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 88%;
    }
    
    #game-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 650px;
    }
    .player-board {
      background: #2d3436;
      border: 2px solid #636e72;
      border-radius: 8px;
      width: 100%;
      padding: 10px;
      text-align: center;
      box-sizing: border-box;
    }
    .stats {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    
    .rage-container {
      width: 100%;
      background: #000;
      border-radius: 6px;
      height: 14px;
      margin: 6px 0;
      overflow: hidden;
      border: 1px solid #ff7675;
    }
    .rage-bar {
      height: 100%;
      background: linear-gradient(90deg, #d63031, #ff7675);
      width: 0%;
      transition: width 0.3s;
    }

    .status-badge {
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 5px;
      font-weight: bold;
    }
    .status-burn { background: #e17055; color: #fff; }
    .status-stun { background: #fdcb6e; color: #000; }

    .hand {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 110px;
      flex-wrap: wrap;
    }
    .card {
      border-radius: 6px;
      width: 85px;
      height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
      box-sizing: border-box;
      cursor: pointer;
      transition: transform 0.15s;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .card:hover { transform: translateY(-5px); }
    .card-atk { background: #c0392b; }
    .card-def { background: #27ae60; }
    .card-heal { background: #2980b9; }
    .card-status { background: #8e44ad; }
    .card-ult { background: linear-gradient(135deg, #d35400, #f39c12); border: 2px solid #f1c40f; }

    .card-name { font-size: 0.7rem; font-weight: bold; }
    .card-cost { color: #f1c40f; font-weight: bold; font-size: 0.8rem; }
    .card-value { font-size: 0.95rem; font-weight: bold; }
    
    #turn-indicator {
      font-size: 1.3rem;
      font-weight: bold;
      color: #e74c3c;
    }

    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: #2c3e50;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
      border: 2px solid #e74c3c;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<h1>P2P Card Battler</h1>

<div id="connection-panel">
  <div style="font-size: 0.9rem; color: #aaa;">YOUR ROOM PIN</div>
  <div class="pin-display">
    <span id="my-pin">....</span>
    <button class="copy-btn" id="copy-pin-btn">Copy</button>
  </div>

  <hr style="border-color: #34495e; margin: 15px 0;">

  <div style="margin-bottom: 8px; font-size: 0.9rem; color: #aaa;">JOIN A FRIEND</div>
  <input type="text" id="join-pin" placeholder="ENTER 4-DIGIT PIN" maxlength="4">
  <button class="action-btn" id="connect-btn">Join Game</button>

  <p id="status-msg" style="color: #f1c40f; margin: 10px 0 0 0; font-weight: bold; font-size: 0.9rem;">Connecting to network...</p>
</div>

<div id="game-arena" class="hidden">
  <div id="turn-indicator">Connecting...</div>

  <!-- Enemy Board -->
  <div class="player-board">
    <div class="stats">
      Opponent HP: <span id="enemy-hp" style="color:#e74c3c;">30</span>
      <span id="enemy-status"></span>
    </div>
  </div>

  <!-- Player Board & Hand -->
  <div class="player-board">
    <div class="stats">
      Your HP: <span id="my-hp" style="color:#2ecc71;">30</span> | 
      Mana: <span id="my-mana" style="color:#f1c40f;">3</span>/3
      <span id="my-status"></span>
    </div>
    
    <div style="font-size: 0.8rem; margin-top: 4px;">RAGE METER (Takes Damage to Fill)</div>
    <div class="rage-container">
      <div id="my-rage-bar" class="rage-bar"></div>
    </div>

    <div class="hand" id="my-hand"></div>
    <button id="end-turn-btn" style="margin-top: 12px; background: #e67e22; padding: 8px 16px; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">End Turn</button>
  </div>
</div>

<div id="block-modal" class="modal hidden">
  <div class="modal-box">
    <h2 style="color: #e74c3c; margin-top: 0;">ATTACK INCOMING!</h2>
    <p id="incoming-atk-msg">Opponent is attacking!</p>
    <p>Choose a Block card to play or take the hit:</p>
    <div class="hand" id="block-hand" style="margin-bottom: 15px;"></div>
    <button id="take-hit-btn" class="action-btn" style="background: #e74c3c;">Take Full Damage</button>
  </div>
</div>

<script>
  let peer = null;
  let conn = null;
  let isHost = false;
  let isMyTurn = false;

  let myHp = 30;
  let enemyHp = 30;
  let myMana = 3;
  let myRage = 0;

  let myBurn = 0;
  let myStun = 0;
  let enemyBurn = 0;
  let enemyStun = 0;

  let myDeck = [];
  let myHand = [];
  let incomingAttack = null;

  // Pools of different card types
  const attackPool = [
    { name: "Slash", cost: 1, type: "atk", val: 5 },
    { name: "Strike", cost: 1, type: "atk", val: 6 },
    { name: "Heavy Swing", cost: 2, type: "atk", val: 9 },
    { name: "Fireball", cost: 3, type: "atk", val: 14 },
    { name: "Ignite", cost: 2, type: "status", statusType: "burn", duration: 3, val: 0 },
    { name: "Thunder", cost: 2, type: "status", statusType: "stun", duration: 1, val: 0 }
  ];

  const blockPool = [
    { name: "Shield", cost: 1, type: "def", val: 4 },
    { name: "Iron Barrier", cost: 2, type: "def", val: 8 },
    { name: "Parry", cost: 1, type: "def", val: 5 }
  ];

  const healPool = [
    { name: "Bandage", cost: 1, type: "heal", val: 4 },
    { name: "Medkit", cost: 2, type: "heal", val: 8 },
    { name: "Regen", cost: 1, type: "heal", val: 5 }
  ];

  const ultCard = { name: "METEOR", cost: 0, rageCost: 100, type: "ult", val: 20 };

  const myPinEl = document.getElementById("my-pin");
  const joinPinInput = document.getElementById("join-pin");
  const connectBtn = document.getElementById("connect-btn");
  const copyBtn = document.getElementById("copy-pin-btn");
  const statusMsg = document.getElementById("status-msg");
  const gameArena = document.getElementById("game-arena");
  const turnIndicator = document.getElementById("turn-indicator");
  const blockModal = document.getElementById("block-modal");

  const PREFIX = "cb-pin-";
  const roomPin = Math.floor(1000 + Math.random() * 9000).toString();
  myPinEl.textContent = roomPin;

  peer = new Peer(PREFIX + roomPin, { debug: 2, secure: true, port: 443 });

  peer.on("open", () => {
    statusMsg.textContent = "Ready! Share your PIN or join a room.";
    statusMsg.style.color = "#2ecc71";
  });

  peer.on("error", (err) => {
    if (err.type === 'unavailable-id') location.reload();
    else {
      statusMsg.textContent = "Connection error. Refresh and try again.";
      statusMsg.style.color = "#e74c3c";
    }
  });

  copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(roomPin);
    copyBtn.textContent = "Copied!";
    setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
  });

  peer.on("connection", (c) => {
    conn = c;
    isHost = true;
    isMyTurn = true;
    setupGame();
  });

  connectBtn.addEventListener("click", () => {
    const pin = joinPinInput.value.trim();
    if (pin.length !== 4) return;
    conn = peer.connect(PREFIX + pin, { reliable: true });
    isHost = false;
    isMyTurn = false;
    setupGame();
  });

  // Builds a 20-card deck with 60% Attacks/Status, 20% Blocks, 20% Heals + 1 Ultimate
  function buildDeck() {
    myDeck = [];
    
    // 12 Attacks / Status cards (60%)
    for (let i = 0; i < 12; i++) {
      const randomAtk = attackPool[Math.floor(Math.random() * attackPool.length)];
      myDeck.push({ ...randomAtk });
    }

    // 4 Block cards (20%)
    for (let i = 0; i < 4; i++) {
      const randomBlock = blockPool[Math.floor(Math.random() * blockPool.length)];
      myDeck.push({ ...randomBlock });
    }

    // 4 Heal cards (20%)
    for (let i = 0; i < 4; i++) {
      const randomHeal = healPool[Math.floor(Math.random() * healPool.length)];
      myDeck.push({ ...randomHeal });
    }

    // Add 1 Ultimate Card
    myDeck.push({ ...ultCard });

    // Shuffle the deck completely
    myDeck.sort(() => Math.random() - 0.5);
  }

  function drawCards(amount) {
    for (let i = 0; i < amount; i++) {
      if (myDeck.length > 0 && myHand.length < 6) {
        myHand.push({ ...myDeck.pop(), id: Math.random() });
      }
    }
  }

  function setupGame() {
    conn.on("open", () => {
      document.getElementById("connection-panel").classList.add("hidden");
      gameArena.classList.remove("hidden");
      buildDeck();
      drawCards(4);
      updateUI();
    });

    conn.on("data", (data) => handleIncomingData(data));
  }

  function handleIncomingData(data) {
    if (data.type === "INCOMING_ATTACK") {
      const blockCards = myHand.filter(card => card.type === "def");

      if (blockCards.length > 0) {
        incomingAttack = data.card;
        document.getElementById("incoming-atk-msg").textContent = `Opponent played ${data.card.name} for ${data.card.val} damage!`;
        renderBlockHand();
        blockModal.classList.remove("hidden");
      } else {
        takeDamage(data.card.val);
        conn.send({ type: "ATTACK_RESOLVED", dmgDealt: data.card.val, blocked: 0 });
        updateUI();
        checkWinCondition();
      }
    }
    else if (data.type === "APPLY_STATUS") {
      if (data.statusType === "burn") myBurn += data.duration;
      if (data.statusType === "stun") myStun += data.duration;
      updateUI();
    }
    else if (data.type === "ATTACK_RESOLVED") {
      updateUI();
      checkWinCondition();
    }
    else if (data.type === "END_TURN") {
      startTurn();
    }
  }

  function takeDamage(amount) {
    myHp -= amount;
    myRage = Math.min(100, myRage + (amount * 5));
  }

  function startTurn() {
    if (myBurn > 0) {
      takeDamage(3);
      myBurn--;
    }

    if (myStun > 0) {
      myStun--;
      conn.send({ type: "END_TURN" });
      alert("You are STUNNED and lost your turn!");
      updateUI();
      return;
    }

    isMyTurn = true;
    myMana = 3;
    drawCards(1);
    updateUI();
  }

  function playCard(index) {
    if (!isMyTurn) return;

    const card = myHand[index];
    
    if (card.type === "ult") {
      if (myRage < 100) {
        alert("You need 100% Rage to play this Ultimate!");
        return;
      }
      myRage = 0;
    } else {
      if (myMana < card.cost) return;
      myMana -= card.cost;
    }

    if (card.type === "def") {
      alert("Block cards can only be played in response to an attack!");
      return;
    }

    myHand.splice(index, 1);

    if (card.type === "atk" || card.type === "ult") {
      conn.send({ type: "INCOMING_ATTACK", card: card });
    } else if (card.type === "status") {
      if (card.statusType === "burn") enemyBurn += card.duration;
      if (card.statusType === "stun") enemyStun += card.duration;
      conn.send({ type: "APPLY_STATUS", statusType: card.statusType, duration: card.duration });
    } else if (card.type === "heal") {
      myHp = Math.min(30, myHp + card.val);
    }

    updateUI();
    checkWinCondition();
  }

  function resolveBlock(blockCardIndex) {
    const blockCardsInHand = myHand.filter(card => card.type === "def");
    const selectedCard = blockCardsInHand[blockCardIndex];

    const handIndex = myHand.findIndex(c => c.id === selectedCard.id);
    if (handIndex !== -1) myHand.splice(handIndex, 1);

    const actualDmg = Math.max(0, incomingAttack.val - selectedCard.val);
    takeDamage(actualDmg);

    blockModal.classList.add("hidden");
    conn.send({ type: "ATTACK_RESOLVED", dmgDealt: actualDmg, blocked: selectedCard.val });

    incomingAttack = null;
    updateUI();
    checkWinCondition();
  }

  document.getElementById("take-hit-btn").addEventListener("click", () => {
    takeDamage(incomingAttack.val);
    blockModal.classList.add("hidden");
    conn.send({ type: "ATTACK_RESOLVED", dmgDealt: incomingAttack.val, blocked: 0 });

    incomingAttack = null;
    updateUI();
    checkWinCondition();
  });

  document.getElementById("end-turn-btn").addEventListener("click", () => {
    if (!isMyTurn) return;
    isMyTurn = false;
    conn.send({ type: "END_TURN" });
    updateUI();
  });

  function checkWinCondition() {
    if (myHp <= 0) {
      alert("You Lost!");
      location.reload();
    } else if (enemyHp <= 0) {
      alert("You Won!");
      location.reload();
    }
  }

  function renderBlockHand() {
    const blockHandContainer = document.getElementById("block-hand");
    blockHandContainer.innerHTML = "";

    const blockCards = myHand.filter(card => card.type === "def");
    blockCards.forEach((card, i) => {
      const cardEl = document.createElement("div");
      cardEl.className = "card card-def";
      cardEl.innerHTML = `
        <div class="card-cost">${card.cost} Mana</div>
        <div class="card-name">${card.name}</div>
        <div class="card-value">🛡️ ${card.val}</div>
      `;
      cardEl.addEventListener("click", () => resolveBlock(i));
      blockHandContainer.appendChild(cardEl);
    });
  }

  function updateUI() {
    document.getElementById("my-hp").textContent = Math.max(0, myHp);
    document.getElementById("enemy-hp").textContent = Math.max(0, enemyHp);
    document.getElementById("my-mana").textContent = myMana;
    document.getElementById("my-rage-bar").style.width = `${myRage}%`;

    document.getElementById("my-status").innerHTML = 
      (myBurn > 0 ? `<span class="status-badge status-burn">🔥 Burn (${myBurn})</span>` : '') +
      (myStun > 0 ? `<span class="status-badge status-stun">⚡ Stunned</span>` : '');

    document.getElementById("enemy-status").innerHTML = 
      (enemyBurn > 0 ? `<span class="status-badge status-burn">🔥 Burn (${enemyBurn})</span>` : '') +
      (enemyStun > 0 ? `<span class="status-badge status-stun">⚡ Stunned</span>` : '');

    turnIndicator.textContent = isMyTurn ? "YOUR TURN" : "OPPONENT'S TURN";
    turnIndicator.style.color = isMyTurn ? "#2ecc71" : "#e74c3c";

    const handContainer = document.getElementById("my-hand");
    handContainer.innerHTML = "";

    myHand.forEach((card, i) => {
      const cardEl = document.createElement("div");
      
      let classType = "card-atk";
      let icon = "⚔️ ";
      if (card.type === "def") { classType = "card-def"; icon = "🛡️ "; }
      if (card.type === "heal") { classType = "card-heal"; icon = "💚 "; }
      if (card.type === "status") { classType = "card-status"; icon = card.statusType === 'burn' ? "🔥 " : "⚡ "; }
      if (card.type === "ult") { classType = "card-ult"; icon = "☄️ "; }

      cardEl.className = `card ${classType}`;
      
      const canAfford = card.type === "ult" ? myRage >= 100 : myMana >= card.cost;
      cardEl.style.opacity = (isMyTurn && canAfford && card.type !== "def") ? "1" : "0.5";
      
      const costLabel = card.type === "ult" ? "100 RAGE" : `${card.cost} Mana`;
      const valLabel = card.type === "status" ? card.statusType.toUpperCase() : icon + card.val;

      cardEl.innerHTML = `
        <div class="card-cost">${costLabel}</div>
        <div class="card-name">${card.name}</div>
        <div class="card-value">${valLabel}</div>
      `;
      cardEl.addEventListener("click", () => playCard(i));
      handContainer.appendChild(cardEl);
    });
  }
</script>

</body>
</html>
