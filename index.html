<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Card Battler - Block System</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 15px;
      user-select: none;
    }
    h1 { margin: 5px 0 15px 0; color: #f1c40f; }
    
    #connection-panel {
      background: #2c3e50;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      width: 320px;
    }
    .pin-display {
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #f1c40f;
      background: #1a1a24;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .copy-btn {
      font-size: 0.9rem;
      padding: 6px 10px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .copy-btn:hover { background: #2980b9; }

    input {
      padding: 12px;
      font-size: 1.2rem;
      border-radius: 6px;
      border: none;
      text-align: center;
      width: 80%;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    button.action-btn {
      padding: 12px 20px;
      font-size: 1rem;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 88%;
    }
    button.action-btn:hover { background: #27ae60; }
    
    #game-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 650px;
    }
    .player-board {
      background: #2d3436;
      border: 2px solid #636e72;
      border-radius: 8px;
      width: 100%;
      padding: 10px;
      text-align: center;
      box-sizing: border-box;
    }
    .stats {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    /* Cards */
    .hand {
      display: flex;
      justify-content: center;
      gap: 10px;
      min-height: 110px;
      flex-wrap: wrap;
    }
    .card {
      border-radius: 6px;
      width: 85px;
      height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
      box-sizing: border-box;
      cursor: pointer;
      transition: transform 0.15s;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .card:hover { transform: translateY(-5px); }
    .card-atk { background: #c0392b; }
    .card-def { background: #27ae60; }
    .card-heal { background: #2980b9; }

    .card-name { font-size: 0.75rem; font-weight: bold; }
    .card-cost { color: #f1c40f; font-weight: bold; font-size: 0.85rem; }
    .card-value { font-size: 1.1rem; font-weight: bold; }
    
    #turn-indicator {
      font-size: 1.3rem;
      font-weight: bold;
      color: #e74c3c;
    }

    /* Modal for Blocking Prompt */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: #2c3e50;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
      border: 2px solid #e74c3c;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<h1>P2P Card Battler</h1>

<div id="connection-panel">
  <div style="font-size: 0.9rem; color: #aaa;">YOUR ROOM PIN</div>
  <div class="pin-display">
    <span id="my-pin">----</span>
    <button class="copy-btn" id="copy-pin-btn">Copy</button>
  </div>

  <hr style="border-color: #34495e; margin: 15px 0;">

  <div style="margin-bottom: 8px; font-size: 0.9rem; color: #aaa;">JOIN A FRIEND</div>
  <input type="text" id="join-pin" placeholder="ENTER 4-DIGIT PIN" maxlength="4">
  <button class="action-btn" id="connect-btn">Join Game</button>

  <p id="status-msg" style="color: #2ecc71; margin: 10px 0 0 0; font-weight: bold;"></p>
</div>

<div id="game-arena" class="hidden">
  <div id="turn-indicator">Connecting...</div>

  <div class="player-board">
    <div class="stats">
      Opponent HP: <span id="enemy-hp" style="color:#e74c3c;">30</span> | 
      Deck: <span id="enemy-deck-count">15</span>
    </div>
  </div>

  <div class="player-board">
    <div class="stats">
      Your HP: <span id="my-hp" style="color:#2ecc71;">30</span> | 
      Mana: <span id="my-mana" style="color:#f1c40f;">3</span>/3 |
      Deck: <span id="my-deck-count">15</span>
    </div>
    <div class="hand" id="my-hand"></div>
    <button id="end-turn-btn" style="margin-top: 12px; background: #e67e22; padding: 8px 16px; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">End Turn</button>
  </div>
</div>

<div id="block-modal" class="modal hidden">
  <div class="modal-box">
    <h2 style="color: #e74c3c; margin-top: 0;">ATTACK INCOMING!</h2>
    <p id="incoming-atk-msg">Opponent is attacking for 0 damage!</p>
    <p>Choose a Block card to play or take the hit:</p>
    <div class="hand" id="block-hand" style="margin-bottom: 15px;"></div>
    <button id="take-hit-btn" class="action-btn" style="background: #e74c3c;">Take Full Damage</button>
  </div>
</div>

<script>
  let peer = null;
  let conn = null;
  let isHost = false;
  let isMyTurn = false;

  let myHp = 30;
  let enemyHp = 30;
  let myMana = 3;
  
  let myDeck = [];
  let myHand = [];
  let incomingAttack = null; // Holds details of an incoming attack when prompted to block

  // 15-Card Deck Template
  const deckMasterList = [
    { name: "Slash", cost: 1, type: "atk", val: 5 },
    { name: "Slash", cost: 1, type: "atk", val: 5 },
    { name: "Heavy Strike", cost: 2, type: "atk", val: 9 },
    { name: "Heavy Strike", cost: 2, type: "atk", val: 9 },
    { name: "Fireball", cost: 3, type: "atk", val: 14 },
    { name: "Shield", cost: 1, type: "def", val: 4 },
    { name: "Shield", cost: 1, type: "def", val: 4 },
    { name: "Iron Barrier", cost: 2, type: "def", val: 8 },
    { name: "Iron Barrier", cost: 2, type: "def", val: 8 },
    { name: "Aegis Wall", cost: 3, type: "def", val: 13 },
    { name: "Bandage", cost: 1, type: "heal", val: 4 },
    { name: "Bandage", cost: 1, type: "heal", val: 4 },
    { name: "Medkit", cost: 2, type: "heal", val: 8 },
    { name: "Medkit", cost: 2, type: "heal", val: 8 },
    { name: "Holy Light", cost: 3, type: "heal", val: 12 }
  ];

  const myPinEl = document.getElementById("my-pin");
  const joinPinInput = document.getElementById("join-pin");
  const connectBtn = document.getElementById("connect-btn");
  const copyBtn = document.getElementById("copy-pin-btn");
  const statusMsg = document.getElementById("status-msg");
  const gameArena = document.getElementById("game-arena");
  const turnIndicator = document.getElementById("turn-indicator");
  const blockModal = document.getElementById("block-modal");

  const PREFIX = "card-battler-pin-";
  const roomPin = Math.floor(1000 + Math.random() * 9000).toString();

  peer = new Peer(PREFIX + roomPin);

  peer.on("open", () => {
    myPinEl.textContent = roomPin;
  });

  copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(roomPin);
    copyBtn.textContent = "Copied!";
    setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
  });

  peer.on("connection", (c) => {
    conn = c;
    isHost = true;
    isMyTurn = true;
    setupGame();
  });

  connectBtn.addEventListener("click", () => {
    const pin = joinPinInput.value.trim();
    if (pin.length !== 4) {
      statusMsg.textContent = "Please enter a 4-digit PIN";
      statusMsg.style.color = "#e74c3c";
      return;
    }

    conn = peer.connect(PREFIX + pin);
    isHost = false;
    isMyTurn = false;
    setupGame();
  });

  function buildDeck() {
    // Clone master list and shuffle
    myDeck = JSON.parse(JSON.stringify(deckMasterList));
    myDeck.sort(() => Math.random() - 0.5);
  }

  function drawCards(amount) {
    for (let i = 0; i < amount; i++) {
      if (myDeck.length > 0 && myHand.length < 6) {
        myHand.push({ ...myDeck.pop(), id: Math.random() });
      }
    }
  }

  function setupGame() {
    statusMsg.textContent = "Connecting...";
    statusMsg.style.color = "#2ecc71";

    conn.on("open", () => {
      document.getElementById("connection-panel").classList.add("hidden");
      gameArena.classList.remove("hidden");
      
      buildDeck();
      drawCards(4);
      updateUI();
    });

    conn.on("data", (data) => {
      handleIncomingData(data);
    });
  }

  function handleIncomingData(data) {
    if (data.type === "INCOMING_ATTACK") {
      // Check if player has any block cards in hand
      const blockCards = myHand.filter(card => card.type === "def");

      if (blockCards.length > 0) {
        // Show Block Reaction Modal
        incomingAttack = data.card;
        document.getElementById("incoming-atk-msg").textContent = `Opponent played ${data.card.name} for ${data.card.val} damage!`;
        renderBlockHand();
        blockModal.classList.remove("hidden");
      } else {
        // No block cards available -> Take full damage immediately
        myHp -= data.card.val;
        conn.send({ type: "ATTACK_RESOLVED", dmgDealt: data.card.val, blocked: 0 });
        updateUI();
        checkWinCondition();
      }
    }
    else if (data.type === "ATTACK_RESOLVED") {
      // Receiver gets feedback on how much damage was actually dealt/blocked
      updateUI();
      checkWinCondition();
    }
    else if (data.type === "END_TURN") {
      isMyTurn = true;
      myMana = 3;
      drawCards(1);
      updateUI();
    }
  }

  function playCard(index) {
    if (!isMyTurn) return;

    const card = myHand[index];
    if (myMana < card.cost) return;

    // Block cards can't be played offensively on your own turn
    if (card.type === "def") {
      alert("Block cards can only be played in response to an opponent's attack!");
      return;
    }

    myMana -= card.cost;
    myHand.splice(index, 1);

    if (card.type === "atk") {
      // Send attack offer to opponent to see if they block
      conn.send({ type: "INCOMING_ATTACK", card: card });
    } else if (card.type === "heal") {
      myHp = Math.min(30, myHp + card.val);
    }

    updateUI();
    checkWinCondition();
  }

  // Handle playing a block card from the reaction modal
  function resolveBlock(blockCardIndex) {
    const blockCardsInHand = myHand.filter(card => card.type === "def");
    const selectedCard = blockCardsInHand[blockCardIndex];

    // Find and remove chosen block card from actual hand
    const handIndex = myHand.findIndex(c => c.id === selectedCard.id);
    if (handIndex !== -1) myHand.splice(handIndex, 1);

    const actualDmg = Math.max(0, incomingAttack.val - selectedCard.val);
    myHp -= actualDmg;

    blockModal.classList.add("hidden");
    conn.send({ type: "ATTACK_RESOLVED", dmgDealt: actualDmg, blocked: selectedCard.val });

    incomingAttack = null;
    updateUI();
    checkWinCondition();
  }

  // Handle opting to take full hit without blocking
  document.getElementById("take-hit-btn").addEventListener("click", () => {
    myHp -= incomingAttack.val;
    blockModal.classList.add("hidden");
    conn.send({ type: "ATTACK_RESOLVED", dmgDealt: incomingAttack.val, blocked: 0 });

    incomingAttack = null;
    updateUI();
    checkWinCondition();
  });

  document.getElementById("end-turn-btn").addEventListener("click", () => {
    if (!isMyTurn) return;

    isMyTurn = false;
    conn.send({ type: "END_TURN" });
    updateUI();
  });

  function checkWinCondition() {
    if (myHp <= 0) {
      alert("You Lost!");
      location.reload();
    } else if (enemyHp <= 0) {
      alert("You Won!");
      location.reload();
    }
  }

  function renderBlockHand() {
    const blockHandContainer = document.getElementById("block-hand");
    blockHandContainer.innerHTML = "";

    const blockCards = myHand.filter(card => card.type === "def");
    blockCards.forEach((card, i) => {
      const cardEl = document.createElement("div");
      cardEl.className = "card card-def";
      cardEl.innerHTML = `
        <div class="card-cost">${card.cost} Mana</div>
        <div class="card-name">${card.name}</div>
        <div class="card-value">🛡️ ${card.val}</div>
      `;
      cardEl.addEventListener("click", () => resolveBlock(i));
      blockHandContainer.appendChild(cardEl);
    });
  }

  function updateUI() {
    document.getElementById("my-hp").textContent = Math.max(0, myHp);
    document.getElementById("enemy-hp").textContent = Math.max(0, enemyHp);
    document.getElementById("my-mana").textContent = myMana;
    document.getElementById("my-deck-count").textContent = myDeck.length;

    turnIndicator.textContent = isMyTurn ? "YOUR TURN" : "OPPONENT'S TURN";
    turnIndicator.style.color = isMyTurn ? "#2ecc71" : "#e74c3c";

    const handContainer = document.getElementById("my-hand");
    handContainer.innerHTML = "";

    myHand.forEach((card, i) => {
      const cardEl = document.createElement("div");
      
      let classType = "card-atk";
      let icon = "⚔️ ";
      if (card.type === "def") { classType = "card-
